<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поворот изображения</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" required>
        <input type="number" name="angle" value="90" required>
        <p>{{ captcha }} = ?</p>
        <input type="number" name="captcha" required>
        <button>Повернуть</button>
    </form>
    {% if error %}<p>{{ error }}</p>{% endif %}
    {% if data %}
        <p>До поворота</p><img src="/static/original.png">
        <p>После поворота</p><img src="/static/rotated.png">
        <p>RGB до</p><img src="/static/graph1.png">
        <p>RGB после</p><img src="/static/graph2.png">
    {% endif %}
</body>
</html>
